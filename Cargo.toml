[workspace]
resolver = "3"
members = ["crates/kh-core", "crates/kh-win", "crates/kh-ffi"]

[workspace.lints.rust]
unsafe_code = "deny"   # kh-win overrides this locally; every unsafe block needs a // SAFETY: comment

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
