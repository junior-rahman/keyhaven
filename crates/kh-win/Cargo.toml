[package]
name = "kh_win"
version = "0.1.0"
edition = "2024"

# Cargo cannot override one inherited lint, so kh-win states its own set.
# It is the only crate allowed `unsafe`, and every block must carry a // SAFETY: comment.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Windows-only: on other targets the crate compiles to nothing (see src/lib.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WinRT", "Win32_Security", "Security_Credentials_UI", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation", "Win32_System_Diagnostics_ToolHelp", "Security_Cryptography_Core"] }
windows-future = "0.3.2" # must match the windows-future that windows 0.62.2 depends on
