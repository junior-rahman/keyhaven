[package]
name = "kh_core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
psl = "2.1.249"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v7"] }
zeroize = { version = "1.9.1", features = ["serde"] }
